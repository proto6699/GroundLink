[package]
name = "groundlink"
version = "0.1.0"
edition = "2024"
description = "Real-time ArduPilot MAVLink telemetry dashboard in Rust"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = "0.3"
mavlink = { version = "0.18", default-features = false, features = ["std", "tokio", "transport-udp", "dialect-ardupilotmega", "mav2-message-extensions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
